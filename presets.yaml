groups:
- name: mmo hunter
  notes: 'Movement on W/A/D/Q/E and space. Shots and pet abilities on action bar 1-8:
    put your main shot on 1 and your rotation after it.'
  presets:
  - jog
  - jump
  - right
  - left
  - stride right
  - stride left
  - right punch
  - left punch
  - right up
  - left up
  - hold sword
  - squat hands out
  - right knee up
  - left knee up
  - pick up
  keys:
    right punch: '1'
    left punch: '2'
    right up: '3'
    left up: '4'
    hold sword: '5'
    squat hands out: '6'
    right knee up: '7'
    left knee up: '8'
- name: mmo mage
  notes: 'Movement on W/A/D/Q/E and space. Spells on action bar 1-8: punches for your
    filler casts, both arms up for a big AoE, t-pose for your freeze, clap to
    interrupt.'
  presets:
  - jog
  - jump
  - right
  - left
  - stride right
  - stride left
  - right punch
  - left punch
  - right up
  - left up
  - both arms up
  - t-pose
  - clap
  - squat hands up
  - pick up
  keys:
    right punch: '1'
    left punch: '2'
    right up: '3'
    left up: '4'
    both arms up: '5'
    t-pose: '6'
    clap: '7'
    squat hands up: '8'
- name: platformer
  notes: 'Side-scrolling platformer on the keyboard: arrows to move, x to jump, z to
    run or attack. Arm out to walk that way, jog to run, punch to attack, squat to
    crouch, right arm up for up.'
  presets:
  - right
  - left
  - jog
  - jump
  - right punch
  - pick up
  - right up
  keys:
    right: right
    left: left
    jog: z
    jump: x
    right punch: z
    pick up: down
    right up: up
- name: light movements
  notes: 'Standing still, arms and head only: no jogging, jumping or squats. For a
    gentle session, or when space is tight. Each pose presses its preset''s default
    key.'
  presets:
  - right
  - left
  - right up
  - left up
  - both arms up
  - t-pose
  - right arm diagonal up
  - left arm diagonal up
  - head tilt left
  - head tilt right
  - hands on head
  - hands on hips
  keys: {}
- name: workout
  notes: 'Full-body moves for a sweat: jogging, jumps, squats, knee lifts, crunches,
    punches and stretches. Star jump also fires jump, and the cross crunches can fire
    a knee lift. Each pose presses its preset''s default key.'
  presets:
  - jog
  - jump
  - star jump
  - squat hands up
  - squat hands out
  - pick up
  - right knee up
  - left knee up
  - right knee to left elbow
  - left knee to right elbow
  - right punch
  - left punch
  - right uppercut
  - left uppercut
  - side bend left
  - side bend right
  - toe touch
  keys: {}
- name: yoga
  notes: 'Easy standing yoga, chest facing the camera, in a flowing order: upward
    salute, forward fold, chair, prayer, tree each side, crescent each side, warrior
    II, goddess. Use learn to go through it with coaching. Each pose presses its preset''s
    default key.'
  presets:
  - both arms up
  - toe touch
  - chair
  - prayer hands
  - tree right
  - tree left
  - crescent left
  - crescent right
  - warrior 2 right
  - warrior 2 left
  - goddess
  keys: {}
